<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Craft - Online</title>
    <style>
        :root { --neon-cyan: #00ffff; --neon-pink: #ff00ff; --neon-green: #39ff14; --neon-red: #ff0000; --bg-color: #050508; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
        body { margin: 0; overflow: hidden; background-color: var(--bg-color); font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-color); box-shadow: 0 0 20px var(--neon-cyan); }
        @media (min-width: 1024px) { #game-container { height: 56.25vw; max-height: 100vh; max-width: 177.78vh; } }
        
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; }
        .title { font-size: 3rem; margin-bottom: 10px; font-weight: bold; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); text-align: center; text-transform: uppercase; letter-spacing: 5px; }
        .auth-box { background: rgba(0, 255, 255, 0.05); border: 2px solid var(--neon-cyan); padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,255,255,0.2); display: flex; flex-direction: column; gap: 15px; width: 300px; pointer-events: auto; }
        .auth-box input { padding: 12px; background: black; border: 1px solid var(--neon-cyan); color: white; font-family: 'Courier New', monospace; outline: none; user-select: text !important; -webkit-user-select: text !important; }
        .btn { padding: 15px; font-size: 1.2rem; cursor: pointer; border: 2px solid var(--neon-pink); background: transparent; color: var(--neon-pink); font-weight: bold; transition: 0.3s; text-shadow: 0 0 5px var(--neon-pink); width: 100%; margin-bottom: 10px; }
        .btn-cyan { border-color: var(--neon-cyan); color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan); }
        .btn-green { border-color: var(--neon-green); color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
        .btn-guest { border-color: #aaa; color: #aaa; font-size: 1rem; padding: 10px; text-shadow: none; margin-top: 10px; width: auto;}
        
        #error-msg { color: #ff0055; font-weight: bold; text-align: center; min-height: 20px; font-size: 14px;}
        #hud { position: absolute; top: 20px; left: 20px; font-weight: bold; z-index: 50; display: none; background: rgba(0,0,0,0.5); padding: 10px; border: 1px solid var(--neon-green); pointer-events: none;}
        #hud div { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); font-size: 20px; margin-bottom: 5px;}
        #hud .user-label { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); font-size: 16px;}
        #hud .mode-label { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); font-size: 14px;}
        
        #fullscreen-btn { position: absolute; top: 20px; right: 20px; font-size: 16px; padding: 10px; background: rgba(0,255,255,0.2); border: 2px solid var(--neon-cyan); color: var(--neon-cyan); font-weight: bold; cursor: pointer; z-index: 50; display: none; }
        #quit-btn { display: none; position: absolute; top: 20px; right: 80px; font-size: 16px; padding: 10px; background: rgba(255,0,85,0.2); border: 2px solid #ff0055; color: #ff0055; font-weight: bold; cursor: pointer; z-index: 50;}
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--neon-cyan); font-size: 20px; text-shadow: 0 0 8px var(--neon-cyan); z-index: 10; display: none; pointer-events: none;}
        
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 50; display: none; }
        .slot { width: 35px; height: 35px; border: 2px solid white; cursor: pointer; opacity: 0.5; border-radius: 5px; box-shadow: 0 0 5px #000 inset; }
        .slot.active { opacity: 1; border: 3px solid #fff; box-shadow: 0 0 15px #fff; transform: scale(1.1); }

        #mobile-ui { display: none; z-index: 20; position: absolute; width: 100%; height: 100%; pointer-events: none; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 130px; height: 130px; background: rgba(0, 255, 255, 0.1); border: 2px solid var(--neon-cyan); border-radius: 50%; pointer-events: auto; z-index: 30; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(0, 255, 255, 0.6); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        #action-btns { position: absolute; bottom: 20px; right: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; pointer-events: auto; z-index: 30;}
        .action-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; cursor: pointer; background: rgba(0,0,0,0.5); }
        #fire-btn { border: 3px solid var(--neon-pink); color: var(--neon-pink); }
        #jump-btn { border: 3px solid var(--neon-green); color: var(--neon-green); }
        #build-btn { border: 3px solid var(--neon-cyan); color: var(--neon-cyan); }
        #break-btn { border: 3px solid #ffaa00; color: #ffaa00; }
        #weapon-btn { position: absolute; top: -80px; right: 0; width: 155px; height: 50px; border-radius: 10px; border: 3px solid white; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; background: rgba(255,255,255,0.2); pointer-events: auto;}

        #rotate-warning { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: var(--neon-cyan); z-index: 999; flex-direction: column; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; }
        @media (orientation: portrait) and (max-width: 768px) { #rotate-warning { display: flex; } }
    </style>
</head>
<body>
    
    <div id="rotate-warning"><div>📱</div><p>Please rotate horizontally to play.</p></div>

    <div id="game-container">
        <div id="auth-screen" class="overlay">
            <div class="title">Neon Craft <br><span style="font-size: 1.5rem; color: #39ff14">Online</span></div>
            <div class="auth-box">
                <input type="text" id="username" placeholder="Enter Username">
                <input type="password" id="password" placeholder="Enter Password">
                <div id="error-msg"></div>
                <button class="btn btn-cyan" onclick="handleAuth('login')">LOGIN</button>
                <button class="btn" onclick="handleAuth('register')">REGISTER</button>
            </div>
            <button class="btn btn-guest" onclick="playAsGuest()">PLAY AS GUEST</button>
        </div>

        <div id="mode-screen" class="overlay" style="display: none;">
            <div class="title">Choose Mode</div>
            <div class="auth-box" style="border-color: transparent; box-shadow: none; background: transparent;">
                <button class="btn btn-green" onclick="selectMode('single')">👤 SINGLE PLAYER</button>
                <button class="btn btn-cyan" onclick="selectMode('multi')">🌐 MULTIPLAYER</button>
            </div>
            <button class="btn btn-guest" onclick="logout()">LOGOUT</button>
        </div>

        <div id="menu" class="overlay" style="display: none;">
            <div class="title">Welcome <span id="display-user" style="color:var(--neon-pink)"></span></div>
            <p style="margin-bottom: 20px;">Cloud High Score: <span id="display-highscore" style="color:var(--neon-green)">0</span></p>
            <div class="auth-box" style="border-color: transparent; box-shadow: none; background: transparent;">
                <button class="btn btn-cyan" onclick="startGame('pc')">🎮 PLAY ON PC</button>
                <button class="btn" onclick="startGame('mobile')">📱 PLAY ON MOBILE</button>
            </div>
            <button class="btn btn-guest" onclick="backToMode()">BACK</button>
        </div>

        <button id="fullscreen-btn" onclick="toggleFullScreen()">⛶ FS</button>
        <button id="quit-btn" onclick="quitGame()">🚪 QUIT</button>

        <div id="hud">
            <div class="user-label">USER: <span id="hud-user"></span></div>
            <div class="mode-label" id="hud-mode">MODE: Single</div>
            <div style="color: #ff0055 !important;">💚 HP: <span id="hp-display">20/20</span></div>
            <div id="score-board">SCORE: 0</div>
            <div id="highscore-board">HIGH: 0</div>
        </div>
        <div id="crosshair">+</div>

        <div id="hotbar">
            <div class="slot active" style="background: #00ffff" onclick="selectColor(0, 0x00ffff)"></div>
            <div class="slot" style="background: #ff00ff" onclick="selectColor(1, 0xff00ff)"></div>
            <div class="slot" style="background: #39ff14" onclick="selectColor(2, 0x39ff14)"></div>
            <div class="slot" style="background: #ffff00" onclick="selectColor(3, 0xffff00)"></div>
            <div class="slot" style="background: #ff0000" onclick="selectColor(4, 0xff0000)"></div>
        </div>

        <div id="mobile-ui">
            <div id="look-zone"></div>
            <div id="joystick-zone"><div id="joystick-stick"></div></div>
            <div id="action-btns">
                <div id="weapon-btn" onclick="switchWeapon()">🔫 SMG</div>
                <div class="action-btn" id="build-btn">BUILD</div>
                <div class="action-btn" id="break-btn">BREAK</div>
                <div class="action-btn" id="jump-btn">JUMP</div>
                <div class="action-btn" id="fire-btn">FIRE</div>
            </div>
        </div>
    </div>

    <script id="sun-vertex" type="x-shader/x-vertex">
        varying vec3 vNormal; void main() { vNormal = normalize( normalMatrix * normal ); gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }
    </script>
    <script id="sun-fragment" type="x-shader/x-fragment">
        varying vec3 vNormal; uniform float time; void main() { float c = 1.0; float intensity = pow( 0.9 - dot( vNormal, vec3( 0.0, 0.0, 1.0 ) ), 2.5 ); float r = 0.5 + 0.5 * sin(time + 0.0); float g = 0.5 + 0.5 * sin(time + 2.0); float b = 0.5 + 0.5 * sin(time + 4.0); vec3 neonColor = vec3(r, g, b); vec3 finalGlow = vec3(0.0) + neonColor * intensity; float fuzzyEdge = 0.95 - dot(vNormal, vec3(0.0, 0.0, 1.0)); vec3 deepColors = vec3(fuzzyEdge, 1.0 - fuzzyEdge, sin(time + fuzzyEdge * 5.0) * fuzzyEdge); vec3 cFinal = (vec3(0.0, 0.8, 1.0) * (fuzzyEdge - 0.2) + neonColor) * fuzzyEdge; float smooth_alpha = smoothstep(0.0, 0.4, fuzzyEdge); float soft_center = smoothstep(1.0, 0.9, fuzzyEdge); gl_FragColor = vec4(cFinal * 2.0, (smooth_alpha * soft_center) * fuzzyEdge); }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAe7" + "Tn404K0hNljSP3govm11WPD6rnFdvE", authDomain: "neon-craft-v2.firebaseapp.com",
            projectId: "neon-craft-v2", storageBucket: "neon-craft-v2.firebasestorage.app",
            messagingSenderId: "584021164194", appId: "1:584021164194:web:0f95f7f36c601a5d9e57fb"
        };
        firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
        let currentUser = "Guest", highScore = 0, currentScore = 0, selectedMode = 'single';
        let maxHP = 20, currentHP = 20; 

        auth.onAuthStateChanged((user) => { if (user) fetchCloudScore(user.email.split('@')[0]); });

        function switchScreen(hideId, showId) { document.getElementById(hideId).style.display = 'none'; document.getElementById(showId).style.display = 'flex'; }
        
        function playAsGuest() {
            currentUser = "Guest"; highScore = 0;
            document.getElementById('display-user').innerText = "Guest"; document.getElementById('display-highscore').innerText = "0 (Not Saved)";
            document.getElementById('hud-user').innerText = "Guest"; document.getElementById('highscore-board').innerText = "HIGH: 0";
            switchScreen('auth-screen', 'mode-screen');
        }

        function handleAuth(action) {
            const user = document.getElementById('username').value.trim(); const pass = document.getElementById('password').value.trim();
            const err = document.getElementById('error-msg');
            if(!user || !pass) return err.innerText = "Please enter both fields.";
            const fakeEmail = user + "@neonvoxel.com"; err.style.color = "white"; err.innerText = "Connecting to Cloud...";
            if(action === 'register') {
                auth.createUserWithEmailAndPassword(fakeEmail, pass).then(() => {
                    db.collection("users").doc(user).set({ score: 0 }); err.style.color = "var(--neon-green)"; err.innerText = "Registered! Logging in...";
                    setTimeout(() => fetchCloudScore(user), 1000);
                }).catch((error) => { err.style.color = "var(--neon-red)"; err.innerText = error.message; });
            } else if(action === 'login') {
                auth.signInWithEmailAndPassword(fakeEmail, pass).then(() => { fetchCloudScore(user); })
                .catch(() => { err.style.color = "var(--neon-red)"; err.innerText = "Invalid Username or Password"; });
            }
        }

        function fetchCloudScore(user) {
            currentUser = user;
            db.collection("users").doc(user).get().then((doc) => {
                highScore = doc.exists ? doc.data().score : 0;
                document.getElementById('display-user').innerText = user; document.getElementById('display-highscore').innerText = highScore;
                document.getElementById('hud-user').innerText = user; document.getElementById('highscore-board').innerText = "HIGH: " + highScore;
                switchScreen('auth-screen', 'mode-screen');
            }).catch(() => { highScore = 0; switchScreen('auth-screen', 'mode-screen'); });
        }

        function selectMode(mode) { selectedMode = mode; document.getElementById('hud-mode').innerText = "MODE: " + (mode === 'single' ? "Single Player" : "Multiplayer"); switchScreen('mode-screen', 'menu'); }
        function backToMode() { switchScreen('menu', 'mode-screen'); }
        function logout() { auth.signOut(); currentUser = null; switchScreen('mode-screen', 'auth-screen'); switchScreen('menu', 'auth-screen'); }

        function addScore(points) {
            currentScore += points; document.getElementById('score-board').innerText = "SCORE: " + currentScore;
            if(currentScore > highScore) {
                highScore = currentScore; document.getElementById('highscore-board').innerText = "HIGH: " + highScore;
                if(currentUser !== "Guest") db.collection("users").doc(currentUser).set({ score: highScore }, { merge: true }).catch(e => console.log("Save error", e));
            }
        }

        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>{}); else if (document.exitFullscreen) document.exitFullscreen(); }
        function quitGame() { window.location.reload(); }

        let camera, scene, renderer, controls, raycaster, socket;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, joystickX = 0, joystickY = 0; 
        let canJump = false, prevTime = performance.now(), velocity = new THREE.Vector3(), deviceType = '';
        
        const mobs = [], floorTiles = [], lasers = [], deathEffects = [], orbs = [];
        const otherPlayers = {}, serverMobs = {}; 
        const builtBlocks = []; 
        let selectedColor = 0x00ffff; const colorList = [0x00ffff, 0xff00ff, 0x39ff14, 0xffff00, 0xff0000];
        let currentWeapon = 0; 
        let singlePlayerMobTimer, leftGun, rightGun;
        const TILE_SIZE = 4, GRID_SIZE = 20; 

        const container = document.getElementById('game-container'); 
        
        // Clouds Array
        const clouds = [];

        // 2. The Sun Material Reference
        let sunMaterial;

        function createTextSprite(msg) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 28px Courier New';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#00ffff';
            ctx.fillText(msg, 128, 48);
            const tex = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: tex, depthTest: false }); 
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(4, 1, 1);
            sprite.position.y = 3.8; 
            return sprite;
        }

        // 3. Spawning the True 3D Shader Sun
        function createGlowSun() {
            sunMaterial = new THREE.ShaderMaterial({ uniforms: { time: { value: 1.0 } }, vertexShader: document.getElementById('sun-vertex').textContent, fragmentShader: document.getElementById('sun-fragment').textContent, transparent: true, blending: THREE.AdditiveBlending, fog: false });
            const sunGeometry = new THREE.SphereGeometry(60, 32, 32); 
            const sun = new THREE.Mesh(sunGeometry, sunMaterial); 
            sun.position.set(0, 150, -300); // High up in the sky void!
            scene.add(sun);
        }

        // 4. NEON WIREFRAME CLOUDS (Matching the ground!)
        function createClouds() {
            const cloudGeo = new THREE.BoxGeometry(20, 5, 20);
            const solidMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, fog: false }); // Dark core
            const wireMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, fog: false }); // Cyan wireframe
            for(let i=0; i<30; i++) {
                const cloudSolid = new THREE.Mesh(cloudGeo, solidMat);
                const cloudWire = new THREE.Mesh(cloudGeo, wireMat);
                cloudSolid.add(cloudWire);
                cloudSolid.position.set((Math.random() - 0.5) * 400, 60 + Math.random() * 20, (Math.random() - 0.5) * 400);
                cloudSolid.scale.set(1 + Math.random()*2, 1, 1 + Math.random()*2);
                scene.add(cloudSolid);
                clouds.push(cloudSolid);
            }
        }

        function selectColor(index, color) {
            selectedColor = color; let slots = document.querySelectorAll('.slot');
            slots.forEach(s => s.classList.remove('active')); slots[index].classList.add('active');
        }

        function switchWeapon() {
            currentWeapon = (currentWeapon === 0) ? 1 : 0;
            document.getElementById('weapon-btn').innerText = currentWeapon === 0 ? "🔫 SMG" : "💥 SHOTGUN";
        }

        function startGame(type) {
            deviceType = type;
            document.getElementById('menu').style.display = 'none'; document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hud').style.display = 'block'; document.getElementById('fullscreen-btn').style.display = 'block';
            document.getElementById('quit-btn').style.display = 'block'; document.getElementById('hotbar').style.display = 'flex';

            currentScore = 0; document.getElementById('score-board').innerText = "SCORE: 0";
            currentHP = maxHP; updateHPDisplay(); 

            toggleFullScreen(); initEngine(); createGuns(); generateInfiniteFloor();
            
            if (selectedMode === 'multi') setupMultiplayer(); else singlePlayerMobTimer = setInterval(spawnHumanoidMob, 2500); 
            if (type === 'pc') setupPCControls(); else { document.getElementById('mobile-ui').style.display = 'block'; setupMobileControls(); }
            animate();
        }

        function initEngine() {
            scene = new THREE.Scene(); 
            scene.fog = new THREE.Fog(0x050508, 15, 60); 
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000); // Keeps vision wide to see sun!
            camera.rotation.order = 'YXZ'; camera.position.y = 2; scene.add(camera);
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); 
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement); raycaster = new THREE.Raycaster();
            window.addEventListener('resize', () => { camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });
            
            createGlowSun(); // Bring back the glowing 3D sun
            createClouds(); // Spawn the new wireframe clouds
        }

        function setupMultiplayer() {
            socket = io("https://neon-craft-production.up.railway.app");
            socket.on('currentPlayers', (players) => { Object.keys(players).forEach(id => { if (id !== socket.id) addOtherPlayer(id, players[id]); }); });
            socket.on('newPlayer', (playerInfo) => { addOtherPlayer(playerInfo.id, playerInfo.position); });
            
            socket.on('playerMoved', (data) => {
                if (otherPlayers[data.id]) {
                    let p = otherPlayers[data.id]; 

                    if(data.position.username && p.userData.username !== data.position.username) {
                        p.userData.username = data.position.username;
                        if(p.userData.nameSprite) p.remove(p.userData.nameSprite);
                        p.userData.nameSprite = createTextSprite(data.position.username);
                        p.add(p.userData.nameSprite);
                    }

                    let dist = Math.hypot(p.position.x - data.position.x, p.position.z - data.position.z);
                    p.userData.animTime = (p.userData.animTime || 0) + dist * 10; let swing = Math.sin(p.userData.animTime) * 0.8;
                    p.userData.legL.rotation.x = swing; p.userData.legR.rotation.x = -swing; p.userData.armL.rotation.x = -swing; p.userData.armR.rotation.x = swing;
                    p.position.set(data.position.x, data.position.y, data.position.z); 
                    if (data.position.rx !== undefined) { p.rotation.y = data.position.ry; p.userData.head.rotation.x = data.position.rx; }
                }
            });
            socket.on('playerDisconnected', (id) => { if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; } });

            socket.on('playerHurt', () => { playerTakeDamage(); });

            socket.on('initBlocks', (blocks) => { blocks.forEach(b => buildPhysicalBlock(b)); });
            socket.on('blockPlaced', (data) => { buildPhysicalBlock(data); });
            socket.on('blockBroken', (id) => { removePhysicalBlock(id); });
            socket.on('mobSpawned', (mobData) => { addServerMob(mobData); });
            socket.on('currentMobs', (mobsData) => { for(let id in mobsData) addServerMob(mobsData[id]); });
            socket.on('mobsUpdate', (mobsData) => {
                for(let id in mobsData) {
                    if(serverMobs[id]) {
                        serverMobs[id].position.set(mobsData[id].x, mobsData[id].y, mobsData[id].z); serverMobs[id].lookAt(camera.position.x, serverMobs[id].position.y, camera.position.z);
                        serverMobs[id].userData.animTime = (serverMobs[id].userData.animTime || 0) + 0.2; let swing = Math.sin(serverMobs[id].userData.animTime) * 0.8;
                        serverMobs[id].userData.legL.rotation.x = swing; serverMobs[id].userData.legR.rotation.x = -swing; serverMobs[id].userData.armL.rotation.x = -swing; serverMobs[id].userData.armR.rotation.x = swing;
                    }
                }
            });
            socket.on('mobDied', (mobId) => { killServerMob(mobId); });
            socket.on('otherPlayerShoot', (data) => {
                let p = otherPlayers[data.playerId]; if(!p) return;
                let dummy = new THREE.Object3D(); dummy.position.copy(p.position); dummy.position.y += 1.2; dummy.rotation.set(data.rot.x, data.rot.y, data.rot.z, 'YXZ');
                fireVisualLaser(dummy, data.color);
            });
        }

        function updateHPDisplay() { document.getElementById('hp-display').innerText = currentHP + "/" + maxHP; }

        function playerTakeDamage() {
            currentHP--; updateHPDisplay();
            const flash = document.createElement('div'); flash.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.3);z-index:99;pointer-events:none;";
            container.appendChild(flash); setTimeout(() => flash.remove(), 100);
            if (currentHP <= 0) respawnPlayer();
        }

        function respawnPlayer() {
            const deathMsg = document.createElement('div');
            deathMsg.innerText = "DEFEATED!";
            deathMsg.style.cssText = "position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:#ff0055;font-size:40px;font-weight:bold;z-index:999;text-shadow:0 0 20px #ff0055;pointer-events:none;transition:1s;";
            document.body.appendChild(deathMsg);
            setTimeout(() => { deathMsg.style.opacity = 0; setTimeout(()=>deathMsg.remove(), 1000); }, 2000);

            camera.position.set(0, 2.0, 0); camera.rotation.set(0,0,0); velocity.set(0,0,0);
            currentScore = 0; document.getElementById('score-board').innerText = "SCORE: 0"; 
            currentHP = maxHP; updateHPDisplay(); 
        }

        function buildPhysicalBlock(data) {
            let existing = builtBlocks.find(b => b.userData.id === data.id); if(existing) return; 
            const geo = new THREE.BoxGeometry(4, 4, 4); const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x001111 })); 
            const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: data.color, wireframe: true }));
            mesh.add(wire); mesh.position.set(data.x, data.y, data.z); mesh.userData = { isBlock: true, id: data.id };
            scene.add(mesh); builtBlocks.push(mesh);
        }

        function removePhysicalBlock(id) { let index = builtBlocks.findIndex(b => b.userData.id === id); if (index !== -1) { scene.remove(builtBlocks[index]); builtBlocks.splice(index, 1); } }
        function attemptBuild() { raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); const targets = [...floorTiles, ...builtBlocks]; const intersects = raycaster.intersectObjects(targets, true); if (intersects.length > 0) { let inter = intersects[0]; let pt = inter.point.clone().add(inter.face.normal.clone().multiplyScalar(0.1)); let bx = Math.round(pt.x / 4) * 4; let by = Math.floor(pt.y / 4) * 4 + 2; let bz = Math.round(pt.z / 4) * 4; if (Math.abs(camera.position.x - bx) < 2 && Math.abs(camera.position.z - bz) < 2 && Math.abs(camera.position.y - by) < 3) return; const blockId = bx + "_" + by + "_" + bz; const blockData = { id: blockId, x: bx, y: by, z: bz, color: selectedColor }; if (socket && selectedMode === 'multi') socket.emit('placeBlock', blockData); else buildPhysicalBlock(blockData); } }
        function attemptDestroy() { raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); const intersects = raycaster.intersectObjects(builtBlocks, true); if (intersects.length > 0) { let hitObj = intersects[0].object; while (hitObj.parent && !hitObj.userData.isBlock) hitObj = hitObj.parent; if (hitObj.userData.isBlock) { let id = hitObj.userData.id; if (socket && selectedMode === 'multi') socket.emit('breakBlock', id); else removePhysicalBlock(id); } } }
        function getFloorHeight() { let maxFloor = 2.0; builtBlocks.forEach(b => { let dx = Math.abs(camera.position.x - b.position.x); let dz = Math.abs(camera.position.z - b.position.z); if (dx < 2.2 && dz < 2.2) { let surfaceY = b.position.y + 4.0; if (surfaceY > maxFloor && camera.position.y >= surfaceY - 2.5) maxFloor = surfaceY; } }); return maxFloor; }

        function addOtherPlayer(id, pos) {
            const playerGroup = new THREE.Group(); const bodyGroup = new THREE.Group(); bodyGroup.position.y = -2;
            const matWire = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true }); const matSolid = new THREE.MeshBasicMaterial({ color: 0x001111 }); const matEye = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const buildPart = (w, h, d, yPos) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matSolid); const w2 = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWire); m.add(w2); m.position.y = yPos; return m; };
            const head = buildPart(0.6, 0.6, 0.6, 3.2); const body = buildPart(0.6, 2.0, 0.4, 1.9); const eyeL = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), matEye); eyeL.position.set(-0.15, 0.1, -0.31); const eyeR = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), matEye); eyeR.position.set(0.15, 0.1, -0.31); head.add(eyeL); head.add(eyeR);
            const armL = new THREE.Group(); armL.position.set(-0.5, 2.8, 0); armL.add(buildPart(0.2, 1.5, 0.2, -0.75)); const armR = new THREE.Group(); armR.position.set(0.5, 2.8, 0); armR.add(buildPart(0.2, 1.5, 0.2, -0.75));
            const legL = new THREE.Group(); legL.position.set(-0.2, 0.9, 0); legL.add(buildPart(0.25, 1.8, 0.25, -0.9)); const legR = new THREE.Group(); legR.position.set(0.2, 0.9, 0); legR.add(buildPart(0.25, 1.8, 0.25, -0.9));
            bodyGroup.add(head); bodyGroup.add(body); bodyGroup.add(armL); bodyGroup.add(armR); bodyGroup.add(legL); bodyGroup.add(legR); playerGroup.add(bodyGroup);
            playerGroup.userData = { isPlayer: true, head: head, armL: armL, armR: armR, legL: legL, legR: legR, animTime: 0, username: "" };
            
            if(pos.username) {
                const tag = createTextSprite(pos.username);
                playerGroup.add(tag);
                playerGroup.userData.username = pos.username;
                playerGroup.userData.nameSprite = tag;
            }

            playerGroup.position.set(pos.x, pos.y, pos.z); if (pos.ry !== undefined) playerGroup.rotation.y = pos.ry;
            scene.add(playerGroup); otherPlayers[id] = playerGroup;
        }

        function addServerMob(data) {
            const mobGroup = new THREE.Group(); mobGroup.userData = { isServerMob: true, id: data.id, animTime: 0 };
            const matWire = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true }); const matSolid = new THREE.MeshBasicMaterial({ color: 0x110011 }); const matEye = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const buildPart = (w, h, d, yPos) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matSolid); const w2 = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWire); m.add(w2); m.position.y = yPos; return m; };
            const head = buildPart(0.6, 0.6, 0.6, 3.2); const body = buildPart(0.6, 2.0, 0.4, 1.9); const eyeL = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), matEye); eyeL.position.set(-0.15, 0.1, -0.31); const eyeR = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), matEye); eyeR.position.set(0.15, 0.1, -0.31); head.add(eyeL); head.add(eyeR);
            const armL = new THREE.Group(); armL.position.set(-0.5, 2.8, 0); armL.add(buildPart(0.2, 1.5, 0.2, -0.75)); const armR = new THREE.Group(); armR.position.set(0.5, 2.8, 0); armR.add(buildPart(0.2, 1.5, 0.2, -0.75));
            const legL = new THREE.Group(); legL.position.set(-0.2, 0.9, 0); legL.add(buildPart(0.25, 1.8, 0.25, -0.9)); const legR = new THREE.Group(); legR.position.set(0.2, 0.9, 0); legR.add(buildPart(0.25, 1.8, 0.25, -0.9));
            mobGroup.add(head); mobGroup.add(body); mobGroup.add(armL); mobGroup.add(armR); mobGroup.add(legL); mobGroup.add(legR);
            mobGroup.userData.armL = armL; mobGroup.userData.armR = armR; mobGroup.userData.legL = legL; mobGroup.userData.legR = legR; mobGroup.position.set(data.x, data.y, data.z); scene.add(mobGroup); serverMobs[data.id] = mobGroup;
        }

        function killServerMob(mobId) { if (serverMobs[mobId]) { const hitObj = serverMobs[mobId]; const blast = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 1), new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true, transparent: true, opacity: 1 })); blast.position.copy(hitObj.position); blast.position.y += 1.2; scene.add(blast); deathEffects.push({ mesh: blast, age: 0 }); dropOrbs(hitObj.position); scene.remove(hitObj); delete serverMobs[mobId]; } }
        
        function spawnHumanoidMob() { 
            if (mobs.length > 15) return; 
            const mobGroup = new THREE.Group(); mobGroup.userData = { isMob: true, speed: 5 + Math.random() * 4, animTime: Math.random() * 10 }; const matWire = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true }); const matSolid = new THREE.MeshBasicMaterial({ color: 0x110011 }); const matEye = new THREE.MeshBasicMaterial({ color: 0xff0000 }); const buildPart = (w, h, d, yPos) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matSolid); const w2 = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWire); m.add(w2); m.position.y = yPos; return m; }; const head = buildPart(0.6, 0.6, 0.6, 3.2); const body = buildPart(0.6, 2.0, 0.4, 1.9); const eyeL = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), matEye); eyeL.position.set(-0.15, 0.1, -0.31); const eyeR = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), matEye); eyeR.position.set(0.15, 0.1, -0.31); head.add(eyeL); head.add(eyeR); const armL = new THREE.Group(); armL.position.set(-0.5, 2.8, 0); armL.add(buildPart(0.2, 1.5, 0.2, -0.75)); const armR = new THREE.Group(); armR.position.set(0.5, 2.8, 0); armR.add(buildPart(0.2, 1.5, 0.2, -0.75)); const legL = new THREE.Group(); legL.position.set(-0.2, 0.9, 0); legL.add(buildPart(0.25, 1.8, 0.25, -0.9)); const legR = new THREE.Group(); legR.position.set(0.2, 0.9, 0); legR.add(buildPart(0.25, 1.8, 0.25, -0.9)); mobGroup.add(head); mobGroup.add(body); mobGroup.add(armL); mobGroup.add(armR); mobGroup.add(legL); mobGroup.add(legR); mobGroup.userData.armL = armL; mobGroup.userData.armR = armR; mobGroup.userData.legL = legL; mobGroup.userData.legR = legR; const angle = Math.random() * Math.PI * 2, dist = 25 + Math.random() * 15; mobGroup.position.set(camera.position.x + Math.cos(angle) * dist, 0.5, camera.position.z + Math.sin(angle) * dist); scene.add(mobGroup); mobs.push(mobGroup); 
        }
        
        function updateMobs(delta) { 
            for (let i = mobs.length - 1; i >= 0; i--) { 
                const mob = mobs[i]; 
                let oldPos = mob.position.clone();
                mob.lookAt(camera.position.x, mob.position.y, camera.position.z); 
                mob.translateZ(mob.userData.speed * delta); 
                mob.userData.animTime += delta * 12; 
                const swing = Math.sin(mob.userData.animTime) * 0.8; mob.userData.legL.rotation.x = swing; mob.userData.legR.rotation.x = -swing; mob.userData.armL.rotation.x = -swing; mob.userData.armR.rotation.x = swing; 
                
                let hitBlock = false;
                for(let b of builtBlocks) { if(Math.abs(mob.position.x - b.position.x) < 2.2 && Math.abs(mob.position.z - b.position.z) < 2.2 && Math.abs(mob.position.y - b.position.y) < 3) hitBlock = true; }
                if(hitBlock) mob.position.copy(oldPos);

                let hDist = Math.hypot(camera.position.x - mob.position.x, camera.position.z - mob.position.z);
                let vDist = Math.abs(camera.position.y - mob.position.y);
                if (hDist < 2.2 && vDist < 3.0) { 
                    playerTakeDamage();
                    scene.remove(mob); 
                    mobs.splice(i, 1);  
                } 
            } 
        }

        function createGuns() { const createGun = (color) => { const group = new THREE.Group(); const body = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.5), new THREE.MeshBasicMaterial({color: color, wireframe: true})); const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.3), new THREE.MeshBasicMaterial({color: 0xffffff, wireframe: true})); barrel.position.set(0, 0.05, -0.3); group.add(body); group.add(barrel); return group; }; leftGun = createGun(0x00ffff); leftGun.position.set(-0.35, -0.3, -0.6); rightGun = createGun(0xff00ff); rightGun.position.set(0.35, -0.3, -0.6); camera.add(leftGun); camera.add(rightGun); }
        function fireVisualLaser(originObj, colorHex) { const mat = new THREE.MeshBasicMaterial({ color: colorHex }); const laser = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 50).rotateX(Math.PI / 2), mat); laser.position.copy(originObj.position); laser.quaternion.copy(originObj.quaternion); laser.translateZ(-25); scene.add(laser); lasers.push({ mesh: laser, age: 0 }); }
        function shoot() { leftGun.position.z = -0.4; leftGun.rotation.x = 0.2; rightGun.position.z = -0.4; rightGun.rotation.x = 0.2; let colorHex = currentWeapon === 0 ? 0x00ffff : 0xff0000; if (currentWeapon === 0) { fireVisualLaser(camera, colorHex); if (socket && selectedMode === 'multi') socket.emit('playerShoot', { rot: {x: camera.rotation.x, y: camera.rotation.y, z: camera.rotation.z}, color: colorHex }); } else { let spread = [-0.1, 0, 0.1]; spread.forEach(offset => { let dummy = new THREE.Object3D(); dummy.position.copy(camera.position); dummy.quaternion.copy(camera.quaternion); dummy.rotateY(offset); fireVisualLaser(dummy, colorHex); if (socket && selectedMode === 'multi') socket.emit('playerShoot', { rot: {x: dummy.rotation.x, y: dummy.rotation.y, z: dummy.rotation.z}, color: colorHex }); }); } raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); if (selectedMode === 'single') { const intersects = raycaster.intersectObjects(mobs, true); if (intersects.length > 0) { let hitObj = intersects[0].object; while (hitObj.parent && !hitObj.userData.isMob) hitObj = hitObj.parent; if (hitObj.userData.isMob) { const blast = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 1), new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true, transparent: true, opacity: 1 })); blast.position.copy(hitObj.position); blast.position.y += 1.2; scene.add(blast); deathEffects.push({ mesh: blast, age: 0 }); dropOrbs(hitObj.position); scene.remove(hitObj); mobs.splice(mobs.indexOf(hitObj), 1); addScore(100); } } } else { const sMobsArray = Object.values(serverMobs); const intersects = raycaster.intersectObjects(sMobsArray, true); if (intersects.length > 0) { let hitObj = intersects[0].object; while (hitObj.parent && !hitObj.userData.isServerMob) hitObj = hitObj.parent; if (hitObj.userData.isServerMob) { socket.emit('mobKilled', hitObj.userData.id); addScore(100); } } } }

        function generateInfiniteFloor() { 
            const geoFloor = new THREE.BoxGeometry(TILE_SIZE, 0.5, TILE_SIZE); 
            for (let x = -GRID_SIZE/2; x < GRID_SIZE/2; x++) { 
                for (let z = -GRID_SIZE/2; z < GRID_SIZE/2; z++) { 
                    const solid = new THREE.Mesh(geoFloor, new THREE.MeshBasicMaterial({ color: 0x001a00 })); 
                    const wire = new THREE.Mesh(geoFloor, new THREE.MeshBasicMaterial({ color: 0x39ff14, wireframe: true })); 
                    solid.add(wire); solid.position.set(x * TILE_SIZE, 0, z * TILE_SIZE); scene.add(solid); floorTiles.push(solid); 
                } 
            } 
        }
        
        function updateInfiniteFloor() { const halfGrid = (GRID_SIZE / 2) * TILE_SIZE; floorTiles.forEach(tile => { let wrapped = false; if (camera.position.z < tile.position.z - halfGrid) { tile.position.z -= halfGrid * 2; wrapped = true; } if (camera.position.z > tile.position.z + halfGrid) { tile.position.z += halfGrid * 2; wrapped = true; } if (camera.position.x < tile.position.x - halfGrid) { tile.position.x -= halfGrid * 2; wrapped = true; } if (camera.position.x > tile.position.x + halfGrid) { tile.position.x += halfGrid * 2; wrapped = true; } }); }
        function dropOrbs(pos) { for(let i=0; i<4; i++) { const orb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffff00 })); orb.position.copy(pos); orb.position.y += 1; scene.add(orb); orbs.push({ mesh: orb, age: 0, vx: (Math.random() - 0.5) * 15, vy: 5 + Math.random() * 8, vz: (Math.random() - 0.5) * 15 }); } }

        function triggerJump() { if (canJump) { velocity.y += 20.0; canJump = false; } }
        function setupPCControls() { controls = new THREE.PointerLockControls(camera, container); container.addEventListener('click', (e) => { if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && !e.target.classList.contains('slot') && e.target.id !== 'weapon-btn') controls.lock(); }); document.addEventListener('keydown', (e) => { if(e.code === 'KeyW') moveForward = true; if(e.code === 'KeyA') moveLeft = true; if(e.code === 'KeyS') moveBackward = true; if(e.code === 'KeyD') moveRight = true; if(e.code === 'Space') triggerJump(); if(e.key >= '1' && e.key <= '5') selectColor(parseInt(e.key)-1, colorList[parseInt(e.key)-1]); if(e.code === 'KeyQ') switchWeapon(); }); document.addEventListener('keyup', (e) => { if(e.code === 'KeyW') moveForward = false; if(e.code === 'KeyA') moveLeft = false; if(e.code === 'KeyS') moveBackward = false; if(e.code === 'KeyD') moveRight = false; }); container.addEventListener('mousedown', (e) => { if(controls.isLocked) { if(e.button === 0) shoot(); else if(e.button === 2) attemptBuild(); else if(e.button === 1) attemptDestroy(); } }); container.addEventListener('contextmenu', e => e.preventDefault()); }
        function setupMobileControls() { const jZone = document.getElementById('joystick-zone'); const jStick = document.getElementById('joystick-stick'); let jCenterX, jCenterY, joyPointerId = null; const updateJoystick = (e) => { let dx = e.clientX - jCenterX, dy = e.clientY - jCenterY, dist = Math.sqrt(dx*dx + dy*dy), max = 45; if (dist > max) { dx = (dx / dist) * max; dy = (dy / dist) * max; } jStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; joystickX = dx / max; joystickY = dy / max; }; const resetJoystick = () => { joystickX = 0; joystickY = 0; jStick.style.transform = `translate(-50%, -50%)`; jStick.style.background = 'rgba(0, 255, 255, 0.6)'; }; jZone.addEventListener('pointerdown', (e) => { if (joyPointerId !== null) return; joyPointerId = e.pointerId; jZone.setPointerCapture(e.pointerId); const rect = jZone.getBoundingClientRect(); jCenterX = rect.left + rect.width / 2; jCenterY = rect.top + rect.height / 2; jStick.style.background = 'rgba(0, 255, 255, 1)'; updateJoystick(e); }); jZone.addEventListener('pointermove', (e) => { if (e.pointerId === joyPointerId) updateJoystick(e); }); const releaseJoy = (e) => { if (e.pointerId === joyPointerId) { jZone.releasePointerCapture(e.pointerId); joyPointerId = null; resetJoystick(); } }; jZone.addEventListener('pointerup', releaseJoy); jZone.addEventListener('pointercancel', releaseJoy); document.getElementById('fire-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); shoot(); }); document.getElementById('jump-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); triggerJump(); }); document.getElementById('build-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); attemptBuild(); }); document.getElementById('break-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); attemptDestroy(); }); const lookZone = document.getElementById('look-zone'); let lookPointerId = null, lookX = 0, lookY = 0; lookZone.addEventListener('pointerdown', (e) => { if (lookPointerId !== null) return; lookPointerId = e.pointerId; lookZone.setPointerCapture(e.pointerId); lookX = e.clientX; lookY = e.clientY; }); lookZone.addEventListener('pointermove', (e) => { if (e.pointerId === lookPointerId) { let dx = e.clientX - lookX; let dy = e.clientY - lookY; camera.rotation.y -= dx * 0.005; camera.rotation.x -= dy * 0.005; camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x)); lookX = e.clientX; lookY = e.clientY; } }); const releaseLook = (e) => { if (e.pointerId === lookPointerId) { lookZone.releasePointerCapture(e.pointerId); lookPointerId = null; } }; lookZone.addEventListener('pointerup', releaseLook); lookZone.addEventListener('pointercancel', releaseLook); }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = (time - prevTime) / 1000;
            
            // ANIMATE THE 3D SHADER ORB!
            if (sunMaterial) { sunMaterial.uniforms.time.value += delta; }

            if (leftGun && rightGun) {
                leftGun.position.z += (-0.6 - leftGun.position.z) * 0.1; leftGun.rotation.x += (0 - leftGun.rotation.x) * 0.1;    
                rightGun.position.z += (-0.6 - rightGun.position.z) * 0.1; rightGun.rotation.x += (0 - rightGun.rotation.x) * 0.1;    
            }
            velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;
            
            let inputX = 0; let inputZ = 0;
            if (deviceType === 'pc') { inputX = Number(moveRight) - Number(moveLeft); inputZ = Number(moveBackward) - Number(moveForward); if (inputX !== 0 || inputZ !== 0) { let len = Math.sqrt(inputX*inputX + inputZ*inputZ); inputX /= len; inputZ /= len; } } else if (deviceType === 'mobile') { inputX = joystickX; inputZ = joystickY; }
            velocity.x += inputX * 60.0 * delta; velocity.z += inputZ * 60.0 * delta; velocity.y -= 40.0 * delta; 
            if (deviceType === 'pc' && controls && controls.isLocked) { controls.moveRight(velocity.x * delta); controls.moveForward(-velocity.z * delta); } else if (deviceType === 'mobile') { const vec = new THREE.Vector3(velocity.x * delta, 0, velocity.z * delta); vec.applyEuler(new THREE.Euler(0, camera.rotation.y, 0, 'YXZ')); camera.position.add(vec); }
            let currentFloorLevel = getFloorHeight(); camera.position.y += velocity.y * delta; if (camera.position.y < currentFloorLevel) { velocity.y = 0; camera.position.y = currentFloorLevel; canJump = true; }

            if (selectedMode === 'multi' && socket) socket.emit('playerMovement', { x: camera.position.x, y: camera.position.y, z: camera.position.z, rx: camera.rotation.x, ry: camera.rotation.y, username: currentUser });
            
            updateInfiniteFloor(); 
            if (selectedMode === 'single') updateMobs(delta);

            // ANIMATE CLOUDS
            clouds.forEach(c => {
                c.position.x += 3.0 * delta; 
                if (c.position.x > 250) c.position.x = -250; 
            });

            for (let i = lasers.length - 1; i >= 0; i--) { lasers[i].age += delta; if (lasers[i].age > 0.08) { scene.remove(lasers[i].mesh); lasers.splice(i, 1); } }
            for (let i = deathEffects.length - 1; i >= 0; i--) { deathEffects[i].age += delta; deathEffects[i].mesh.scale.addScalar(delta * 10); deathEffects[i].mesh.material.opacity -= delta * 2; if (deathEffects[i].mesh.material.opacity <= 0) { scene.remove(deathEffects[i].mesh); deathEffects.splice(i, 1); } }
            for (let i = orbs.length - 1; i >= 0; i--) { let o = orbs[i]; o.age += delta; o.vy -= 25 * delta; o.mesh.position.x += o.vx * delta; o.mesh.position.y += o.vy * delta; o.mesh.position.z += o.vz * delta; if (o.mesh.position.y <= 0.8) { o.mesh.position.y = 0.8; o.vy *= -0.5; o.vx *= 0.8; o.vz *= 0.8; } if (o.age > 4) { scene.remove(o.mesh); orbs.splice(i, 1); } }
            
            Object.values(otherPlayers).forEach(p => {
                if(p.userData.nameSprite) { p.userData.nameSprite.quaternion.copy(camera.quaternion).multiply(p.quaternion.clone().invert()); }
            });

            prevTime = time; renderer.render(scene, camera);
        }
        function quitGame() { window.location.reload(); }
    </script>
